<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Review Form – Karla Loyaga</title>
    <meta name="description" content="Submit a product review form for WDD 131, Karla Loyaga.">
    <meta name="author" content="Karla Loyaga">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Roboto:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles/form.css">
    <script src="scripts/form.js" defer></script>
</head>
<body>
    <header>
        <h1>Product Review</h1>
    </header>

    <main>
        <form action="review.html" method="get">
            <div class="form-group">
                <label for="product">Product Name</label>
                <select id="product" name="product" required>
                    <option value="" disabled selected>Select a Product ...</option>
                </select>
            </div>

            <div class="form-group">
                <fieldset>
                    <legend>Overall Rating</legend>
                    <div class="rating">
                        <input type="radio" id="rating1" name="rating" value="1" required>
                        <label for="rating1">1 star</label>

                        <input type="radio" id="rating2" name="rating" value="2">
                        <label for="rating2">2 stars</label>

                        <input type="radio" id="rating3" name="rating" value="3">
                        <label for="rating3">3 stars</label>

                        <input type="radio" id="rating4" name="rating" value="4">
                        <label for="rating4">4 stars</label>

                        <input type="radio" id="rating5" name="rating" value="5">
                        <label for="rating5">5 stars</label>
                    </div>
                </fieldset>
            </div>

            <div class="form-group">
                <label for="installDate">Date of Installation</label>
                <input type="date" id="installDate" name="installDate" required>
            </div>

            <div class="form-group">
                <fieldset>
                    <legend>Which features did you find useful in the product? (Check all that apply)</legend>
                    <div class="checkbox-group">
                        <div class="checkbox-item">
                            <input type="checkbox" id="durability" name="features" value="Durability">
                            <label for="durability">Durability</label>
                        </div>
                        <div class="checkbox-item">
                            <input type="checkbox" id="easeOfUse" name="features" value="Ease of Use">
                            <label for="easeOfUse">Ease of Use</label>
                        </div>
                        <div class="checkbox-item">
                            <input type="checkbox" id="performance" name="features" value="Performance">
                            <label for="performance">Performance</label>
                        </div>
                        <div class="checkbox-item">
                            <input type="checkbox" id="design" name="features" value="Design">
                            <label for="design">Design</label>
                        </div>
                    </div>
                </fieldset>
            </div>

            <div class="form-group">
                <label for="review">Written Review (Optional)</label>
                <textarea id="review" name="review" rows="5"></textarea>
            </div>

            <div class="form-group">
                <label for="username">Your Name (Optional)</label>
                <input type="text" id="username" name="username">
            </div>

            <div class="form-group">
                <input type="submit" value="Post Review">
            </div>
        </form>
    </main>

    <footer>
        <p>&copy; <span id="currentyear"></span> Karla Loyaga, Trujillo, Peru</p>
        <p id="lastModified"></p>
    </footer>
</body>
</html>
